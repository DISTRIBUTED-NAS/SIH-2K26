# ScaleGuard Backend Configuration

spring.application.name=scaleguard-backend

# Database Configuration (PostgreSQL default, overridden via environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/scaleguard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Expiration in milliseconds: 86400000 ms = 24 hours
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Development Seed Users Configuration
app.seed.enabled=${SEED_USERS_ENABLED:true}

# Server Configuration
server.port=${PORT:8080}
server.error.include-message=always
