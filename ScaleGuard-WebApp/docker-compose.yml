version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: scaleguard-postgres
    restart: always
    environment:
      POSTGRES_DB: scaleguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: scaleguard-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@scaleguard.com
      PGADMIN_DEFAULT_PASSWORD: Admin@123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
